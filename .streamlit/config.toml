# RAGNova runs on one machine and works offline. Read when `streamlit run src/app.py`
# is started from the project root.

[server]
# Streamlit binds to every network interface by default: anyone on the same Wi-Fi
# could open the app and upload files into the corpus. It also prints an "External URL",
# which it only knows by looking up the machine's public IP on the internet.
address = "127.0.0.1"

[browser]
# No usage statistics sent from the app.
gatherUsageStats = false
